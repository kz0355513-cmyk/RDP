name: RDP - Windows 11 + Sunshine + Moonlight

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # ENABLE RDP
      # ============================================================
      - name: Configure RDP Settings 🔧
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring RDP..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            remoteip=100.64.0.0/10 `
            profile=any

          Enable-NetFirewallRule `
            -DisplayName "Remote Desktop (TCP-In)" `
            -ErrorAction SilentlyContinue

          Restart-Service -Name TermService -Force

          $timeout = (Get-Date).AddSeconds(30)

          while ((Get-Service -Name TermService).Status -ne "Running") {

            if ((Get-Date) -gt $timeout) {
              throw "TermService failed to start."
            }

            Start-Sleep -Seconds 2
          }

          Write-Host "RDP is running."


      # ============================================================
      # CREATE RDP USER
      # ============================================================
      - name: Create RDP User 🔐
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $upper   = [char[]](65..90)
          $lower   = [char[]](97..122)
          $numbers = [char[]](48..57)

          $special = (
            [char[]](33..47) +
            [char[]](58..64) +
            [char[]](91..96) +
            [char[]](123..126)
          )

          $passwordChars = @()

          $passwordChars += $upper   | Get-Random -Count 4
          $passwordChars += $lower   | Get-Random -Count 4
          $passwordChars += $numbers | Get-Random -Count 4
          $passwordChars += $special | Get-Random -Count 4

          $password = -join (
            $passwordChars |
            Sort-Object { Get-Random }
          )

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "RDP" `
            -Password $securePassword `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          "RDP_USER=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "RDP user created."


      # ============================================================
      # INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale 🌐
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tsVersion = "1.90.6"

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-$tsVersion-amd64.msi"

          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          curl.exe `
            -L `
            --retry 5 `
            --retry-delay 5 `
            --connect-timeout 30 `
            --max-time 300 `
            -o "$installer" `
            "$tsUrl"

          if (-not (Test-Path $installer)) {
            throw "Tailscale download failed."
          }

          if ((Get-Item $installer).Length -lt 1000000) {
            throw "Tailscale installer appears to be invalid."
          }

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Tailscale installed."


      # ============================================================
      # CONNECT TAILSCALE
      # ============================================================
      - name: Establish Tailscale Connection 🌐
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable not found."
          }

          & $tailscale up `
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
            --hostname="gh-sunshine-$env:GITHUB_RUN_ID"

          $tsIP = $null

          for ($i = 0; $i -lt 20; $i++) {

            $result = & $tailscale ip -4 2>$null

            foreach ($line in $result) {

              $line = $line.Trim()

              if ($line -match '^100\.\d{1,3}\.\d{1,3}\.\d{1,3}$') {
                $tsIP = $line
                break
              }
            }

            if ($tsIP) {
              break
            }

            Write-Host "Waiting for Tailscale IP..."

            Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
            throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP"


      # ============================================================
      # DOWNLOAD SUNSHINE
      # ============================================================
      - name: Download Sunshine ☀️
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Finding latest Sunshine release..."

          $apiUrl = "https://api.github.com/repos/LizardByte/Sunshine/releases/latest"

          $release = Invoke-RestMethod `
            -Uri $apiUrl `
            -Headers @{
              "User-Agent" = "GitHub-Actions-Sunshine"
              "Accept" = "application/vnd.github+json"
            }

          $assets = $release.assets

          $asset = $assets |
            Where-Object {
              $_.name -match 'Windows.*AMD64.*\.msi$'
            } |
            Select-Object -First 1

          if (-not $asset) {

            Write-Host "Available Sunshine assets:"

            $assets |
              ForEach-Object {
                Write-Host $_.name
              }

            throw "Could not find Sunshine Windows AMD64 MSI."
          }

          $sunshineUrl = $asset.browser_download_url
          $installer = "$env:TEMP\Sunshine.msi"

          Write-Host ""
          Write-Host "Latest Sunshine:"
          Write-Host $release.tag_name

          Write-Host ""
          Write-Host "Downloading:"
          Write-Host $asset.name

          Write-Host ""
          Write-Host "Download URL:"
          Write-Host $sunshineUrl

          # ========================================================
          # CURL WITH RETRIES
          # ========================================================

          curl.exe `
            -L `
            --fail `
            --retry 10 `
            --retry-all-errors `
            --retry-delay 5 `
            --connect-timeout 30 `
            --max-time 600 `
            -A "Mozilla/5.0 GitHub-Actions" `
            -o "$installer" `
            "$sunshineUrl"

          if ($LASTEXITCODE -ne 0) {
            throw "curl failed to download Sunshine. Exit code: $LASTEXITCODE"
          }

          if (-not (Test-Path $installer)) {
            throw "Sunshine installer was not downloaded."
          }

          $size = (Get-Item $installer).Length

          Write-Host ""
          Write-Host "Downloaded Sunshine size: $size bytes"

          if ($size -lt 5000000) {
            throw "Downloaded Sunshine file is suspiciously small."
          }

          "SUNSHINE_INSTALLER=$installer" >> $env:GITHUB_ENV

          Write-Host "Sunshine download completed successfully."


      # ============================================================
      # INSTALL SUNSHINE
      # ============================================================
      - name: Install Sunshine ☀️
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:SUNSHINE_INSTALLER"

          if (-not (Test-Path $installer)) {
            throw "Sunshine installer not found."
          }

          Write-Host "Installing Sunshine..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList `
              "/i",
              "`"$installer`"",
              "/qn",
              "/norestart",
              "/L*v",
              "`"$env:TEMP\sunshine-install.log`"" `
            -Wait `
            -PassThru `
            -NoNewWindow

          if ($process.ExitCode -ne 0) {
            Write-Host "Sunshine MSI installation failed."
            Get-Content "$env:TEMP\sunshine-install.log" -Tail 80
            throw "Sunshine installation failed with exit code $($process.ExitCode)."
          }

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Sunshine installed successfully."


      # ============================================================
      # CONFIGURE SUNSHINE
      # ============================================================
      - name: Configure Sunshine 🔐
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $sunshineExe = "C:\Program Files\Sunshine\sunshine.exe"

          if (-not (Test-Path $sunshineExe)) {

            $possible = Get-ChildItem `
              "C:\Program Files" `
              -Filter "sunshine.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($possible) {
              $sunshineExe = $possible.FullName
            }
          }

          if (-not (Test-Path $sunshineExe)) {
            throw "Sunshine executable was not found after installation."
          }

          Write-Host "Sunshine executable:"
          Write-Host $sunshineExe

          # ========================================================
          # GENERATE SUNSHINE USERNAME/PASSWORD
          # ========================================================

          $sunUser = "sunshine"

          $chars = (
            [char[]](65..90) +
            [char[]](97..122) +
            [char[]](48..57)
          )

          $sunPassword = -join (
            1..20 | ForEach-Object {
              $chars | Get-Random
            }
          )

          # ========================================================
          # STOP SERVICE BEFORE CONFIGURATION
          # ========================================================

          Stop-Service `
            -Name "Sunshine" `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3

          # ========================================================
          # CREATE SUNSHINE CREDENTIALS
          # ========================================================

          Write-Host "Creating Sunshine Web UI credentials..."

          & $sunshineExe `
            --creds `
            $sunUser `
            $sunPassword

          Start-Sleep -Seconds 3

          # ========================================================
          # FIREWALL
          # ========================================================

          netsh advfirewall firewall delete rule `
            name="Sunshine-Tailscale-Web" 2>$null

          netsh advfirewall firewall delete rule `
            name="Sunshine-Tailscale-TCP" 2>$null

          netsh advfirewall firewall delete rule `
            name="Sunshine-Tailscale-UDP" 2>$null

          netsh advfirewall firewall add rule `
            name="Sunshine-Tailscale-Web" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=47990 `
            remoteip=100.64.0.0/10 `
            profile=any

          netsh advfirewall firewall add rule `
            name="Sunshine-Tailscale-TCP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=47984-47990 `
            remoteip=100.64.0.0/10 `
            profile=any

          netsh advfirewall firewall add rule `
            name="Sunshine-Tailscale-UDP" `
            dir=in `
            action=allow `
            protocol=UDP `
            localport=47998-48000 `
            remoteip=100.64.0.0/10 `
            profile=any

          # ========================================================
          # START SUNSHINE
          # ========================================================

          Write-Host "Starting Sunshine..."

          Start-Service `
            -Name "Sunshine" `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 8

          $service = Get-Service `
            -Name "Sunshine" `
            -ErrorAction SilentlyContinue

          if ($service) {

            Write-Host "Sunshine service status: $($service.Status)"

          }

          # Save variables
          "SUNSHINE_USER=$sunUser" >> $env:GITHUB_ENV
          "SUNSHINE_PASSWORD=$sunPassword" >> $env:GITHUB_ENV
          "SUNSHINE_EXE=$sunshineExe" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "SUNSHINE CONFIGURED"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Username:"
          Write-Host $sunUser
          Write-Host ""
          Write-Host "Password:"
          Write-Host $sunPassword
          Write-Host ""
          Write-Host "Web UI:"
          Write-Host "https://$env:TAILSCALE_IP:47990"
          Write-Host ""
          Write-Host "=============================================="


      # ============================================================
      # CHECK SUNSHINE
      # ============================================================
      - name: Check Sunshine 🔎
        shell: powershell
        run: |
          Write-Host "Waiting for Sunshine Web UI..."

          $success = $false

          for ($i = 0; $i -lt 20; $i++) {

            $check = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 47990 `
              -WarningAction SilentlyContinue

            if ($check.TcpTestSucceeded) {

              $success = $true
              break

            }

            Write-Host "Sunshine is not ready yet..."
            Start-Sleep -Seconds 3
          }

          if ($success) {

            Write-Host ""
            Write-Host "Sunshine Web UI is ONLINE."
            Write-Host "Port: 47990"

          }
          else {

            Write-Host ""
            Write-Host "WARNING: Sunshine Web UI did not respond on port 47990."
            Write-Host "The runner will continue."

          }


      # ============================================================
      # SHOW ACCESS INFORMATION
      # ============================================================
      - name: Display Access Information ✨
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "                  ACCESS INFORMATION"
          Write-Host "======================================================"
          Write-Host ""

          Write-Host "RDP"
          Write-Host "------------------------------------------------------"
          Write-Host "IP:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "Username:"
          Write-Host "$env:RDP_USER"
          Write-Host ""
          Write-Host "Password:"
          Write-Host "$env:RDP_PASSWORD"
          Write-Host ""

          Write-Host "SUNSHINE"
          Write-Host "------------------------------------------------------"
          Write-Host "Web UI:"
          Write-Host "https://$env:TAILSCALE_IP:47990"
          Write-Host ""
          Write-Host "Username:"
          Write-Host "$env:SUNSHINE_USER"
          Write-Host ""
          Write-Host "Password:"
          Write-Host "$env:SUNSHINE_PASSWORD"
          Write-Host ""

          Write-Host "MOONLIGHT"
          Write-Host "------------------------------------------------------"
          Write-Host "PC Address:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "Add the IP above to Moonlight."
          Write-Host "Moonlight will generate the pairing PIN."
          Write-Host "Enter that PIN in Sunshine."
          Write-Host ""

          Write-Host "======================================================"
          Write-Host "                 RUNNER IS ACTIVE"
          Write-Host "======================================================"

          while ($true) {

            Write-Host "[$(Get-Date)] Runner Active..."

            Start-Sleep -Seconds 300
          }
