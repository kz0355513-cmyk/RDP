          Write-Host ""

          Write-Host "PIN PAGE"
          Write-Host "------------------------------------------------------"
          Write-Host "Open on iPhone:"
          Write-Host ""
          Write-Host "http://$env:TAILSCALE_IP:8080"
          Write-Host ""

          Write-Host "Enter the PIN shown by Moonlight."
          Write-Host ""

          Write-Host "======================================================"
          Write-Host "                 RUNNER IS ACTIVE"
          Write-Host "======================================================"
          Write-Host ""

          while ($true) {

            Write-Host `
              "[$(Get-Date)] Runner Active..."

            Start-Sleep -Seconds 300
          }
