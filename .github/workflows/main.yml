name: RDP - Windows 11 + Sunshine + Moonlight

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. ENABLE RDP
      # ============================================================
      - name: Configure RDP 🔧
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring RDP..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          netsh advfirewall firewall delete rule `
            name="RDP-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            remoteip=100.64.0.0/10 `
            profile=any

          Enable-NetFirewallRule `
            -DisplayName "Remote Desktop (TCP-In)" `
            -ErrorAction SilentlyContinue

          Restart-Service `
            -Name TermService `
            -Force

          $timeout = (Get-Date).AddSeconds(30)

          while ((Get-Service TermService).Status -ne "Running") {

            if ((Get-Date) -gt $timeout) {
              throw "TermService failed to start."
            }

            Start-Sleep -Seconds 2
          }

          Write-Host "RDP is running."


      # ============================================================
      # 2. CREATE RDP USER
      # ============================================================
      - name: Create RDP User 🔐
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $upper = [char[]](65..90)
          $lower = [char[]](97..122)
          $numbers = [char[]](48..57)

          $special = (
            [char[]](33..47) +
            [char[]](58..64) +
            [char[]](91..96) +
            [char[]](123..126)
          )

          $passwordChars = @()

          $passwordChars += $upper | Get-Random -Count 4
          $passwordChars += $lower | Get-Random -Count 4
          $passwordChars += $numbers | Get-Random -Count 4
          $passwordChars += $special | Get-Random -Count 4

          $password = -join (
            $passwordChars | Sort-Object { Get-Random }
          )

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "RDP" `
            -Password $securePassword `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          "RDP_USER=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "RDP user created."


      # ============================================================
      # 3. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale 🌐
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $version = "1.90.6"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-$version-amd64.msi"

          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          curl.exe `
            -L `
            --fail `
            --retry 10 `
            --retry-all-errors `
            --retry-delay 5 `
            --connect-timeout 30 `
            --max-time 300 `
            -o "$installer" `
            "$url"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale download failed."
          }

          Start-Process `
            msiexec.exe `
            -ArgumentList `
              "/i",
              "`"$installer`"",
              "/quiet",
              "/norestart" `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Tailscale installed."


      # ============================================================
      # 4. CONNECT TAILSCALE
      # ============================================================
      - name: Connect Tailscale 🌐
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
            throw "Tailscale executable not found."
          }

          & $tailscale up `
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
            --hostname="gh-sunshine-$env:GITHUB_RUN_ID"

          $tsIP = $null

          for ($i = 0; $i -lt 20; $i++) {

            $ips = & $tailscale ip -4 2>$null

            foreach ($ip in $ips) {

              $ip = $ip.Trim()

              if ($ip -match '^100\.\d{1,3}\.\d{1,3}\.\d{1,3}$') {

                $tsIP = $ip
                break
              }
            }

            if ($tsIP) {
              break
            }

            Write-Host "Waiting for Tailscale IP..."

            Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
            throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$tsIP" | Out-File `
            $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $tsIP


      # ============================================================
      # 5. DOWNLOAD SUNSHINE
      # ============================================================
      - name: Download Sunshine ☀️
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Finding latest Sunshine release..."

          $headers = @{
            "User-Agent" = "GitHub-Actions-Sunshine"
            "Accept" = "application/vnd.github+json"
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/LizardByte/Sunshine/releases/latest" `
            -Headers $headers

          Write-Host "Latest Sunshine:"
          Write-Host $release.tag_name

          $asset = $release.assets |
            Where-Object {
              $_.name -eq "sunshine-windows-installer.exe"
            } |
            Select-Object -First 1

          if (-not $asset) {

            Write-Host ""
            Write-Host "Available Windows assets:"

            $release.assets |
              Where-Object {
                $_.name -match "(?i)windows"
              } |
              ForEach-Object {
                Write-Host $_.name
              }

            throw "Sunshine Windows installer was not found."
          }

          $installer = "$env:TEMP\sunshine-installer.exe"

          Write-Host ""
          Write-Host "Downloading:"
          Write-Host $asset.name

          curl.exe `
            -L `
            --fail `
            --retry 12 `
            --retry-all-errors `
            --retry-delay 5 `
            --connect-timeout 30 `
            --max-time 900 `
            -A "Mozilla/5.0" `
            -o "$installer" `
            "$($asset.browser_download_url)"

          if ($LASTEXITCODE -ne 0) {
            throw "Sunshine download failed."
          }

          if (-not (Test-Path $installer)) {
            throw "Sunshine installer does not exist."
          }

          $size = (Get-Item $installer).Length

          Write-Host "Downloaded size: $size bytes"

          if ($size -lt 5000000) {
            throw "Sunshine installer appears incomplete."
          }

          "SUNSHINE_INSTALLER=$installer" | Out-File `
            $env:GITHUB_ENV `
            -Append `
            -Encoding utf8


      # ============================================================
      # 6. INSTALL SUNSHINE
      # ============================================================
      - name: Install Sunshine ☀️
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = $env:SUNSHINE_INSTALLER

          Write-Host "Installing Sunshine..."

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait `
            -PassThru

          Write-Host "Installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            throw "Sunshine installer failed."
          }

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Sunshine installed."


      # ============================================================
      # 7. FIND SUNSHINE
      # ============================================================
      - name: Find Sunshine 🔎
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $paths = @(
            "C:\Program Files\Sunshine\sunshine.exe",
            "C:\Program Files\Sunshine\tools\sunshine.exe",
            "$env:ProgramFiles\Sunshine\sunshine.exe"
          )

          $sunshineExe = $null

          foreach ($path in $paths) {

            if (Test-Path $path) {

              $sunshineExe = $path
              break
            }
          }

          if (-not $sunshineExe) {

            $found = Get-ChildItem `
              "C:\Program Files" `
              -Filter "sunshine.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $sunshineExe = $found.FullName
            }
          }

          if (-not $sunshineExe) {
            throw "sunshine.exe was not found."
          }

          "SUNSHINE_EXE=$sunshineExe" | Out-File `
            $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          Write-Host "Sunshine executable:"
          Write-Host $sunshineExe


      # ============================================================
      # 8. CONFIGURE SUNSHINE CREDENTIALS
      # ============================================================
      - name: Configure Sunshine Credentials 🔐
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = "sunshine"

          $chars = (
            [char[]](65..90) +
            [char[]](97..122) +
            [char[]](48..57)
          )

          $password = -join (
            1..20 | ForEach-Object {
              $chars | Get-Random
            }
          )

          Write-Host "Configuring Sunshine credentials..."

          # Stop Sunshine if it is already running.
          Stop-Process `
            -Name "sunshine" `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3

          & $env:SUNSHINE_EXE `
            --creds `
            $username `
            $password

          Start-Sleep -Seconds 3

          "SUNSHINE_USER=$username" | Out-File `
            $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          "SUNSHINE_PASSWORD=$password" | Out-File `
            $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          Write-Host "Sunshine credentials configured."


      # ============================================================
      # 9. SUNSHINE FIREWALL
      # ============================================================
      - name: Configure Sunshine Firewall 🔥
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          netsh advfirewall firewall delete rule `
            name="Sunshine-Tailscale-Web" 2>$null

          netsh advfirewall firewall delete rule `
            name="Sunshine-Tailscale-TCP" 2>$null

          netsh advfirewall firewall delete rule `
            name="Sunshine-Tailscale-UDP" 2>$null

          netsh advfirewall firewall add rule `
            name="Sunshine-Tailscale-Web" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=47990 `
            remoteip=100.64.0.0/10 `
            profile=any

          netsh advfirewall firewall add rule `
            name="Sunshine-Tailscale-TCP" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=47984-47990 `
            remoteip=100.64.0.0/10 `
            profile=any

          netsh advfirewall firewall add rule `
            name="Sunshine-Tailscale-UDP" `
            dir=in `
            action=allow `
            protocol=UDP `
            localport=47998-48000 `
            remoteip=100.64.0.0/10 `
            profile=any

          Write-Host "Firewall configured."


      # ============================================================
      # 10. START SUNSHINE
      # ============================================================
      - name: Start Sunshine ☀️
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Starting Sunshine..."

          Start-Process `
            -FilePath $env:SUNSHINE_EXE `
            -WorkingDirectory (
              Split-Path $env:SUNSHINE_EXE
            ) `
            -WindowStyle Hidden

          Start-Sleep -Seconds 10

          $check = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 47990 `
            -WarningAction SilentlyContinue

          if (-not $check.TcpTestSucceeded) {

            Write-Host ""
            Write-Host "Sunshine did not open port 47990."

            throw "Sunshine Web UI is not responding."
          }

          Write-Host ""
          Write-Host "Sunshine Web UI is ONLINE."


      # ============================================================
      # 11. CREATE PIN PAGE
      # ============================================================
      - name: Create PIN Page 📱
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $folder = "C:\sunshine-pin"

          New-Item `
            -ItemType Directory `
            -Path $folder `
            -Force | Out-Null

          # --------------------------------------------------------
          # HTML PAGE
          # --------------------------------------------------------

          $html = @'
          <!DOCTYPE html>

          <html>

          <head>

          <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
          >

          <title>Sunshine PIN</title>

          <style>

          * {
            box-sizing: border-box;
          }

          body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #101010;

            color: white;

            font-family:
              -apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              Arial,
              sans-serif;
          }

          .card {

            width: calc(100% - 32px);

            max-width: 420px;

            padding: 30px;

            border-radius: 22px;

            background: #1d1d1d;

            box-shadow:
              0 20px 60px rgba(0,0,0,.5);

            text-align: center;
          }

          h1 {

            margin: 0 0 10px;

            font-size: 28px;
          }

          p {

            color: #aaa;

            margin-bottom: 25px;
          }

          input {

            width: 100%;

            padding: 17px;

            border: 0;

            outline: none;

            border-radius: 14px;

            background: #2b2b2b;

            color: white;

            font-size: 30px;

            text-align: center;

            letter-spacing: 8px;
          }

          button {

            width: 100%;

            margin-top: 18px;

            padding: 17px;

            border: 0;

            border-radius: 14px;

            background: white;

            color: black;

            font-size: 18px;

            font-weight: 700;

            cursor: pointer;
          }

          #status {

            margin-top: 20px;

            min-height: 25px;

            color: #ccc;
          }

          </style>

          </head>

          <body>

          <div class="card">

            <h1>Sunshine PIN</h1>

            <p>
              Enter the 4-digit PIN shown by Moonlight.
            </p>

            <form id="form">

              <input
                id="pin"
                type="text"
                inputmode="numeric"
                maxlength="4"
                minlength="4"
                pattern="[0-9]{4}"
                placeholder="••••"
                autocomplete="off"
                required
              >

              <button type="submit">
                CONNECT
              </button>

            </form>

            <div id="status"></div>

          </div>

          <script>

          const form =
            document.getElementById("form");

          const pin =
            document.getElementById("pin");

          const status =
            document.getElementById("status");

          form.addEventListener(
            "submit",
            async function(event) {

              event.preventDefault();

              const value =
                pin.value.trim();

              if (!/^[0-9]{4}$/.test(value)) {

                status.textContent =
                  "Enter a 4-digit PIN.";

                return;
              }

              status.textContent =
                "Sending PIN to Sunshine...";

              try {

                const response =
                  await fetch(
                    "/pair",
                    {
                      method: "POST",

                      headers: {
                        "Content-Type":
                          "application/json"
                      },

                      body:
                        JSON.stringify({
                          pin: value
                        })
                    }
                  );

                const data =
                  await response.json();

                if (data.success) {

                  status.textContent =
                    "✓ PIN accepted by Sunshine.";

                } else {

                  status.textContent =
                    "✕ " +
                    (data.error ||
                     "Sunshine rejected the PIN.");

                }

              } catch (error) {

                status.textContent =
                  "Connection error.";

              }

            }
          );

          </script>

          </body>

          </html>
          '@

          $html | Set-Content `
            "$folder\index.html" `
            -Encoding UTF8

          Write-Host "PIN page created."


      # ============================================================
      # 12. CREATE POWERSHELL PIN SERVER
      # ============================================================
      - name: Create PIN Server 🖥️
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $folder = "C:\sunshine-pin"

          $server = @'
          $ErrorActionPreference = "Stop"

          $prefix = "http://+:8080/"

          $listener = New-Object `
            System.Net.HttpListener

          $listener.Prefixes.Add($prefix)

          $listener.Start()

          Write-Host ""
          Write-Host "======================================"
          Write-Host "SUNSHINE PIN SERVER"
          Write-Host "Listening on port 8080"
          Write-Host "======================================"
          Write-Host ""

          function Send-Response {

              param(
                  $Context,
                  [int]$StatusCode,
                  [string]$ContentType,
                  [string]$Body
              )

              $bytes =
                [System.Text.Encoding]::UTF8.GetBytes(
                  $Body
                )

              $Context.Response.StatusCode =
                $StatusCode

              $Context.Response.ContentType =
                $ContentType

              $Context.Response.ContentLength64 =
                $bytes.Length

              $Context.Response.OutputStream.Write(
                $bytes,
                0,
                $bytes.Length
              )

              $Context.Response.OutputStream.Close()
          }

          while ($listener.IsListening) {

              try {

                  $context =
                    $listener.GetContext()

                  $request =
                    $context.Request

                  $response =
                    $context.Response

                  # ------------------------------------------------
                  # GET /
                  # ------------------------------------------------

                  if (
                    $request.HttpMethod -eq "GET" -and
                    $request.Url.AbsolutePath -eq "/"
                  ) {

                      $html =
                        Get-Content `
                          "C:\sunshine-pin\index.html" `
                          -Raw

                      Send-Response `
                        $context `
                        200 `
                        "text/html; charset=utf-8" `
                        $html

                      continue
                  }

                  # ------------------------------------------------
                  # POST /pair
                  # ------------------------------------------------

                  if (
                    $request.HttpMethod -eq "POST" -and
                    $request.Url.AbsolutePath -eq "/pair"
                  ) {

                      $reader =
                        New-Object `
                          System.IO.StreamReader(
                            $request.InputStream,
                            $request.ContentEncoding
                          )

                      $body =
                        $reader.ReadToEnd()

                      $reader.Close()

                      try {

                          $data =
                            $body | ConvertFrom-Json

                          $pin =
                            [string]$data.pin

                      }
                      catch {

                          Send-Response `
                            $context `
                            400 `
                            "application/json" `
                            '{"success":false,"error":"Invalid request."}'

                          continue
                      }

                      if (
                        $pin -notmatch '^\d{4}$'
                      ) {

                          Send-Response `
                            $context `
                            400 `
                            "application/json" `
                            '{"success":false,"error":"PIN must contain exactly 4 digits."}'

                          continue
                      }

                      Write-Host ""
                      Write-Host "======================================"
                      Write-Host "PIN RECEIVED:"
                      Write-Host $pin
                      Write-Host "Sending PIN to Sunshine..."
                      Write-Host "======================================"

                      # --------------------------------------------
                      # Sunshine API
                      # --------------------------------------------

                      $pairBody = @{
                          pin = $pin
                          name = "iPhone"
                      } | ConvertTo-Json -Compress

                      $credentialString =
                        $env:SUNSHINE_USER +
                        ":" +
                        $env:SUNSHINE_PASSWORD

                      $credentialBytes =
                        [System.Text.Encoding]::ASCII.GetBytes(
                          $credentialString
                        )

                      $base64 =
                        [Convert]::ToBase64String(
                          $credentialBytes
                        )

                      $headers = @{
                          Authorization =
                            "Basic $base64"
                      }

                      try {

                          $result =
                            Invoke-RestMethod `
                              -Uri "https://127.0.0.1:47990/api/pin" `
                              -Method POST `
                              -Headers $headers `
                              -ContentType "application/json" `
                              -Body $pairBody `
                              -SkipCertificateCheck

                          Write-Host ""
                          Write-Host "SUNSHINE ACCEPTED THE PIN."
                          Write-Host ""

                          $json = @{
                              success = $true
                              message = "PIN accepted by Sunshine."
                          } | ConvertTo-Json -Compress

                          Send-Response `
                            $context `
                            200 `
                            "application/json" `
                            $json
                      }

                      catch {

                          $errorMessage =
                            $_.Exception.Message

                          Write-Host ""
                          Write-Host "SUNSHINE API ERROR:"
                          Write-Host $errorMessage
                          Write-Host ""

                          $json = @{
                              success = $false
                              error = $errorMessage
                          } | ConvertTo-Json -Compress

                          Send-Response `
                            $context `
                            400 `
                            "application/json" `
                            $json
                      }

                      continue
                  }

                  # ------------------------------------------------
                  # 404
                  # ------------------------------------------------

                  Send-Response `
                    $context `
                    404 `
                    "text/plain" `
                    "Not Found"
              }

              catch {

                  Write-Host ""
                  Write-Host "PIN SERVER ERROR:"
                  Write-Host $_.Exception.Message
                  Write-Host ""
              }
          }
          '@

          $server | Set-Content `
            "$folder\server.ps1" `
            -Encoding UTF8

          Write-Host "PIN server created."


      # ============================================================
      # 13. PIN SERVER FIREWALL
      # ============================================================
      - name: Configure PIN Page Firewall 🔥
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          netsh advfirewall firewall delete rule `
            name="Sunshine-PIN-Tailscale" 2>$null

          netsh advfirewall firewall add rule `
            name="Sunshine-PIN-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=8080 `
            remoteip=100.64.0.0/10 `
            profile=any

          Write-Host "PIN page firewall configured."


      # ============================================================
      # 14. START PIN SERVER
      # ============================================================
      - name: Start PIN Page 📱
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Starting PIN page..."

          # --------------------------------------------------------
          # Check server syntax first
          # --------------------------------------------------------

          $script = "C:\sunshine-pin\server.ps1"

          $null = [scriptblock]::Create(
            (Get-Content $script -Raw)
          )

          Write-Host "PIN server syntax OK."

          # --------------------------------------------------------
          # Start PowerShell server
          # --------------------------------------------------------

          $process = Start-Process `
            -FilePath "powershell.exe" `
            -ArgumentList `
              "-NoProfile",
              "-ExecutionPolicy",
              "Bypass",
              "-File",
              "`"$script`"" `
            -WorkingDirectory `
              "C:\sunshine-pin" `
            -PassThru `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          # --------------------------------------------------------
          # Check process
          # --------------------------------------------------------

          if (
            -not (
              Get-Process `
                -Id $process.Id `
                -ErrorAction SilentlyContinue
            )
          ) {

              throw "PIN server exited immediately."
          }

          # --------------------------------------------------------
          # Check port
          # --------------------------------------------------------

          $ready = $false

          for ($i = 0; $i -lt 20; $i++) {

              $check =
                Test-NetConnection `
                  -ComputerName "127.0.0.1" `
                  -Port 8080 `
                  -WarningAction SilentlyContinue

              if ($check.TcpTestSucceeded) {

                  $ready = $true
                  break
              }

              Write-Host `
                "Waiting for PIN page... ($($i + 1)/20)"

              Start-Sleep -Seconds 2
          }

          if (-not $ready) {

              Write-Host ""
              Write-Host "Port 8080 is not listening."

              Write-Host ""
              Write-Host "Current port state:"
              netstat -ano | findstr ":8080"

              throw "PIN page failed to start."
          }

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "             SUNSHINE PIN PAGE READY"
          Write-Host "======================================================"
          Write-Host ""

          Write-Host "OPEN THIS ON YOUR IPHONE:"
          Write-Host ""

          Write-Host `
            "http://$env:TAILSCALE_IP:8080"

          Write-Host ""

          Write-Host "MOONLIGHT PC ADDRESS:"
          Write-Host ""

          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "======================================================"


      # ============================================================
      # 15. FINAL ACCESS INFORMATION
      # ============================================================
      - name: Final Access Information ✨
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================================"
