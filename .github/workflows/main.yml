          Write-Host ""

          Write-Host "RDP"
          Write-Host "------------------------------------------------------"
          Write-Host "Address:"
          Write-Host $env:TAILSCALE_IP
          Write-Host ""
          Write-Host "Username:"
          Write-Host $env:RDP_USER
          Write-Host ""
          Write-Host "Password:"
          Write-Host $env:RDP_PASSWORD
          Write-Host ""

          Write-Host "SUNSHINE"
          Write-Host "------------------------------------------------------"
          Write-Host "Web UI:"
          Write-Host "https://$env:TAILSCALE_IP:47990"
          Write-Host ""
          Write-Host "Username:"
          Write-Host $env:SUNSHINE_USER
          Write-Host ""
          Write-Host "Password:"
          Write-Host $env:SUNSHINE_PASSWORD
          Write-Host ""

          Write-Host "MOONLIGHT"
          Write-Host "------------------------------------------------------"
          Write-Host "PC Address:"
